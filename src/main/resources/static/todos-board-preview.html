<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>和風依頼掲示板・配置検証</title>
    <link rel="stylesheet" href="css/todos-board-preview.css">
    <script src="js/todos-board-preview.js" defer></script>
</head>
<body>
    <main class="preview-layout">
        <aside class="preview-controls" aria-label="検索と並び替えの検証">
            <p class="preview-controls__note">検証用画面です。編集・削除は実データを操作しません。</p>
            <div class="preview-controls__search"><label for="preview-keyword">やることの名前</label><input id="preview-keyword" type="search" placeholder="名前で探す"><label for="preview-category">ジャンル</label><select id="preview-category"><option value="">すべて</option><option>デザイン</option><option>マーケティング</option><option>プログラミング</option><option>資格</option><option>就職活動</option></select><button id="preview-search" type="button">絞り込む</button></div>
            <div class="preview-controls__sort"><span>期限の並び替え</span><div class="preview-controls__sort-buttons"><button type="button" data-order="asc">近い順</button><button type="button" data-order="desc">遠い順</button></div></div>
            <button class="preview-controls__create" type="button">新規登録</button>
            <p class="preview-controls__count" id="preview-count" role="status">8件の依頼書</p>
        </aside>
        <section class="board" aria-labelledby="preview-title">
            <div class="board__frame">
                <div class="board__paper" role="region" aria-label="サンプルの依頼書。縦にスクロールできます" tabindex="0">
                <div class="notice-grid" id="notice-grid">
                    <button class="notice-thumb" type="button" data-title="企画書の表紙を仕上げる" data-memo="表紙の配色と見出しを確認し、共有用の画像を書き出す。" data-category="デザイン" data-priority="高" data-due="2026-11-07" data-status="未完了" aria-label="企画書の表紙を仕上げる（未完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-01-gold.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-gold.png" alt="">
                        <span class="notice-thumb__title">企画書の表紙を仕上げる</span>
                        <img class="notice-thumb__stamp" src="assets/todos/list/themes/japanese-board/stamps/stamp-important.png" alt="">
                    </button>
                    <button class="notice-thumb" type="button" data-title="応募書類を確認して送信する" data-memo="誤字を確認してから応募書類を送信する。" data-category="就職活動" data-priority="中" data-due="2026-11-09" data-status="未完了" aria-label="応募書類を確認して送信する（未完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-02-red-pin.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-red.png" alt="">
                        <span class="notice-thumb__title">応募書類を確認して送信する</span>
                    </button>
                    <button class="notice-thumb" type="button" data-title="週間レポート用の図を整理" data-memo="集計結果を図にまとめ、説明文と数字の対応を確認した。" data-category="マーケティング" data-priority="低" data-due="2026-11-12" data-status="完了" aria-label="週間レポート用の図を整理（完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-03-sakura-tape.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-blue.png" alt="">
                        <span class="notice-thumb__title">週間レポート用の図を整理</span>
                        <img class="notice-thumb__stamp notice-thumb__stamp--done" src="assets/todos/list/themes/japanese-board/stamps/stamp-done.png" alt="">
                    </button>
                    <button class="notice-thumb" type="button" data-title="資格試験の過去問題を復習する" data-memo="間違えた問題の解説を読み、もう一度解き直す。" data-category="資格" data-priority="高" data-due="2026-11-15" data-status="未完了" aria-label="資格試験の過去問題を復習する（未完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-04-wave.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-wood.png" alt="">
                        <span class="notice-thumb__title">資格試験の過去問題を復習する</span>
                        <img class="notice-thumb__stamp" src="assets/todos/list/themes/japanese-board/stamps/stamp-important.png" alt="">
                    </button>
                    <button class="notice-thumb" type="button" data-title="長いタイトルの確認：取引先から届いた複数の要望を読み比べ、担当者ごとの作業内容を整理してから次回の打ち合わせに使う資料へ反映する" data-memo="長文の見本。全文は拡大画面で読み、一覧では先頭の二行だけを表示する。" data-category="プログラミング" data-priority="中" data-due="2026-11-20" data-status="未完了" aria-label="長いタイトル（未完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-05-wave-corner.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-gold.png" alt="">
                        <span class="notice-thumb__title">長いタイトルの確認：取引先から届いた複数の要望を読み比べ、担当者ごとの作業内容を整理してから次回の打ち合わせに使う資料へ反映する</span>
                    </button>
                    <button class="notice-thumb" type="button" data-title="画面の表示幅を検証する" data-memo="PCとスマートフォンの幅で依頼書と操作を確認した。" data-category="デザイン" data-priority="低" data-due="2026-11-25" data-status="完了" aria-label="画面の表示幅を検証する（完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-06-ribbon.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-red.png" alt="">
                        <span class="notice-thumb__title">画面の表示幅を検証する</span>
                        <img class="notice-thumb__stamp notice-thumb__stamp--done" src="assets/todos/list/themes/japanese-board/stamps/stamp-done.png" alt="">
                    </button>
                    <button class="notice-thumb" type="button" data-title="ポスターの桜色を調整する" data-memo="印刷時に読みやすい色合いになるよう試作を比較する。" data-category="デザイン" data-priority="中" data-due="2026-11-27" data-status="未完了" aria-label="ポスターの桜色を調整する（未完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-07-sakura-border.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-blue.png" alt="">
                        <span class="notice-thumb__title">ポスターの桜色を調整する</span>
                    </button>
                    <button class="notice-thumb" type="button" data-title="今週の学習計画をまとめる" data-memo="週末までの課題を確認し、学習する順番を決める。" data-category="資格" data-priority="低" data-due="2026-11-30" data-status="未完了" aria-label="今週の学習計画をまとめる（未完了）の依頼書を開く">
                        <img class="notice-thumb__image" src="assets/todos/list/themes/japanese-board/notices/notice-08-taped.png" alt="">
                        <img class="notice-thumb__pin" src="assets/todos/list/themes/japanese-board/pins/pin-wood.png" alt="">
                        <span class="notice-thumb__title">今週の学習計画をまとめる</span>
                    </button>
                </div>
            </div>
            </div>
            <div class="board__roof" aria-hidden="true"></div>
            <div class="board__post board__post--left" aria-hidden="true"></div>
            <div class="board__post board__post--right" aria-hidden="true"></div>
            <img class="board__foot board__foot--left" src="assets/todos/list/themes/japanese-board/exterior/foot.png" alt="" aria-hidden="true">
            <img class="board__foot board__foot--right" src="assets/todos/list/themes/japanese-board/exterior/foot.png" alt="" aria-hidden="true">
            <img class="board__lantern" src="assets/todos/list/themes/japanese-board/exterior/lantern.png" alt="" aria-hidden="true">
            <img class="board__sakura" src="assets/todos/list/themes/japanese-board/decor/sakura-branch.png" alt="" aria-hidden="true">
            <h1 class="board__title" id="preview-title"><img src="assets/todos/list/themes/japanese-board/title-todo-list.png" alt="やること一覧"></h1>
        </section>
    </main>

    <dialog class="notice-dialog" id="notice-dialog" aria-labelledby="detail-title">
        <button class="notice-dialog__close" id="notice-close" type="button" aria-label="依頼書を閉じる">×</button>
        <div class="notice-dialog__body">
            <div class="notice-dialog__art">
                <img class="notice-dialog__image" id="detail-image" alt="選択した依頼書の絵柄">
                <img class="notice-dialog__pin" id="detail-pin" alt="">
                <span class="notice-dialog__paper-title" id="detail-paper-title"></span>
                <img class="notice-dialog__stamp" id="detail-stamp" alt="" hidden>
            </div>
            <div class="notice-dialog__details">
                <p class="notice-dialog__eyebrow">依頼書の詳細</p>
                <h2 id="detail-title"></h2>
                <p class="notice-dialog__memo" id="detail-memo"></p>
                <dl>
                    <div><dt>ジャンル</dt><dd id="detail-category"></dd></div>
                    <div><dt>優先度</dt><dd id="detail-priority"></dd></div>
                    <div><dt>期限</dt><dd id="detail-due"></dd></div>
                    <div><dt>状態</dt><dd id="detail-status"></dd></div>
                </dl>
                <div class="notice-dialog__actions"><button class="notice-dialog__action notice-dialog__action--edit" type="button" aria-label="編集（検証用）"></button><button class="notice-dialog__action notice-dialog__action--delete" type="button" aria-label="削除（検証用）"></button></div>
                <p class="notice-dialog__hint">編集・削除は配置確認用です。</p>
            </div>
        </div>
    </dialog>
</body>
</html>
