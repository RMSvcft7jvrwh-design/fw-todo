<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=3"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=1"></script>
    <script src="/js/pet-drag.js?v=pet-actions-1" defer></script>
    <link rel="stylesheet" th:href="@{/css/style.css(v='appearance-4')}" href="/css/style.css?v=appearance-5">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="${title}">トップページ</h1>
        <p>やることを管理するアプリです。</p>
        <a class="btn sub" th:href="@{/settings}" href="/settings">⚙ 設定</a>
        <div class="calendar-pet-track" role="img" aria-label="メカ祥子が草地を歩き回る">
            <div class="calendar-pet" aria-hidden="true"></div>
        </div>
        <a class="home-door" th:href="@{/todos}" href="/todos" aria-label="やること一覧へ移動">
            <span class="home-door__panel" aria-hidden="true">
                <span class="home-door__sign">TODO</span>
                <span class="home-door__knob"></span>
            </span>
        </a>
    </main>
</body>
</html>
