<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やることを登録</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=4"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=2"></script>
    <link rel="stylesheet" href="/css/style.css?v=appearance-6">
    <link rel="stylesheet" href="/css/todo-quest.css?v=3">
    <link rel="stylesheet" href="/css/shared-rpg-buttons.css?v=2">
    <script src="/js/pet-drag.js?v=pet-actions-2" defer></script>
</head>

<body>
    <main class="container quest-page">
      <div class="quest-board">
        <div class="quest-paper">
        <form th:action="@{/todos/confirm}" method="post" th:object="${todo}">
            <div class="form-row">
                <label class="form-label" for="title">やること</label>
                <input class="form-input" type="text" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="detail">メモ</label>
                <input class="form-input" type="text" th:field="*{detail}">
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" th:field="*{category}">
                    <option value="">選択してください</option>
                    <option value="デザイン">デザイン</option>
                    <option value="マーケティング">マーケティング</option>
                    <option value="プログラミング">プログラミング</option>
                    <option value="資格">資格</option>
                    <option value="就職活動">就職活動</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority">優先度</label>
                <select class="form-input" th:field="*{priority}">
                    <option value="">選択してください</option>
                    <option value="1">高</option>
                    <option value="2">中</option>
                    <option value="3">低</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="dueDate">期限</label>
                <input class="form-input" type="date" th:field="*{dueDate}">
            </div>
            <div class="quest-actions quest-actions--with-list">
                <button class="btn rpg-image-button rpg-image-button--confirm" type="submit" aria-label="確認する">確認する</button>
                <a class="btn sub rpg-image-button rpg-image-button--list" href="/todos" aria-label="やること一覧へ">一覧へ</a>
            </div>
        </form>
        </div>
        <h1 class="quest-title">やることを登録</h1>
        <img class="quest-clip" src="/assets/todos/themes/quest/clip.png" alt="" aria-hidden="true">
      </div>
    </main>
    <div class="idle-pet" role="img" aria-label="メカ祥子が待機している"></div>
</body>

</html>
