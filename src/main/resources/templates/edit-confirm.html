<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集の確認</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=3"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=1"></script>
    <link rel="stylesheet" href="/css/style.css?v=appearance-5">
    <link rel="stylesheet" href="/css/todo-quest.css?v=3">
    <script src="/js/pet-drag.js?v=pet-actions-1" defer></script>
</head>
<body>
    <main class="container quest-page">
      <div class="quest-board quest-board--confirm">
        <div class="quest-paper">
        <p class="confirm-value">やること：<span th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}">（入力なし）</span></p>
        <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}">（入力なし）</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : (todo.priority == 3 ? '低' : '（入力なし）'))}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>
        <p class="confirm-value">完了：<span th:text="${todo.completed == null ? '（入力なし）' : (todo.completed ? '完了' : '未完了')}">（入力なし）</span></p>
        <form th:action="@{/todos/{id}(id=${id})}" method="post" th:object="${todo}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">
            <input type="hidden" th:field="*{completed}">
            <div class="confirm-actions">
                <button class="btn" type="submit">保存する</button>
                <button class="btn sub" type="submit" th:formaction="@{/todos/{id}/edit(id=${id})}">書き直す</button>
            </div>
        </form>
        </div>
        <h1 class="quest-title">編集の確認</h1>
        <img class="quest-clip" src="/assets/todos/themes/quest/clip.png" alt="" aria-hidden="true">
        <img class="quest-seal" src="/assets/todos/themes/quest/seal.png" alt="" aria-hidden="true">
      </div>
    </main>
    <div class="idle-pet" role="img" aria-label="メカ祥子が待機している"></div>
</body>
</html>
