<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="|${year}年${month}月|">カレンダー</h1>
        <nav class="calendar-nav" aria-label="カレンダーの操作">
            <div class="calendar-nav-group">
                <a class="link" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
            </div>
            <div class="calendar-nav-group">
                <a class="link" href="/todos">表で見る</a>
                <a class="link" href="/todos/new">新規登録</a>
            </div>
        </nav>
        <div class="calendar-scroll">
            <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
                <thead>
                    <tr>
                        <th scope="col">日</th>
                        <th scope="col">月</th>
                        <th scope="col">火</th>
                        <th scope="col">水</th>
                        <th scope="col">木</th>
                        <th scope="col">金</th>
                        <th scope="col">土</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="week : ${weeks}">
                        <th:block th:each="date : ${week}">
                            <td th:if="${date != null}" th:attr="data-date=${date}" th:text="${date.dayOfMonth}"></td>
                            <td th:unless="${date != null}" class="calendar-empty"></td>
                        </th:block>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        async function loadTodos() {
            const table = document.querySelector('.calendar-table');
            const from = table.dataset.from;
            const to = table.dataset.to;
            const cells = table.querySelectorAll('td[data-date]');

            try {
                const res = await fetch(`/api/todos?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
                if (!res.ok) {
                    throw new Error('Todoの取得に失敗しました');
                }
                const todos = await res.json();
                const now = new Date();
                const localToday = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                function createTodoLink(todo) {
                    const item = document.createElement('a');
                    item.href = `/todos/${encodeURIComponent(todo.id)}/edit`;
                    item.classList.add('calendar-todo-link');
                    item.textContent = todo.title;
                    if (!todo.completed && todo.dueDate < localToday) {
                        item.classList.add('calendar-overdue');
                    }
                    return item;
                }

                for (const cell of cells) {
                    const dayTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                    for (const todo of dayTodos.slice(0, 3)) {
                        const item = createTodoLink(todo);
                        if (dayTodos.length >= 3) {
                            item.classList.add('calendar-todo-compact');
                        }
                        cell.appendChild(item);
                    }
                    if (dayTodos.length > 3) {
                        const details = document.createElement('details');
                        const summary = document.createElement('summary');
                        summary.textContent = `ほか ${dayTodos.length - 3}件`;
                        details.appendChild(summary);
                        for (const todo of dayTodos.slice(3)) {
                            details.appendChild(createTodoLink(todo));
                        }
                        cell.appendChild(details);
                    }
                }
            } catch (error) {
                console.error(error);
            }
        }

        function showHolidayWarning() {
            if (document.getElementById('holiday-warning')) {
                return;
            }
            const warning = document.createElement('p');
            warning.id = 'holiday-warning';
            warning.textContent = '祝日を取れませんでした';
            document.querySelector('main').prepend(warning);
        }

        async function loadHolidays() {
            const table = document.querySelector('.calendar-table');
            const from = table.dataset.from;
            const to = table.dataset.to;
            const cells = table.querySelectorAll('td[data-date]');

            for (const cell of cells) {
                const weekday = new Date(`${cell.dataset.date}T00:00:00Z`).getUTCDay();
                if (weekday === 6) {
                    cell.style.backgroundColor = '#e0f2fe';
                } else if (weekday === 0) {
                    cell.style.backgroundColor = '#ffe4e6';
                }
            }

            try {
                const res = await fetch(`/api/holidays?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
                if (res.headers.has('X-Holidays-Unavailable')) {
                    showHolidayWarning();
                }
                if (!res.ok) {
                    throw new Error('祝日の取得に失敗しました');
                }
                const holidays = await res.json();

                for (const cell of cells) {
                    const date = cell.dataset.date;
                    if (Object.prototype.hasOwnProperty.call(holidays, date)) {
                        cell.style.backgroundColor = '#fef3c7';
                        cell.title = holidays[date];
                    }
                }
            } catch (error) {
                showHolidayWarning();
                console.error(error);
            }
        }

        loadTodos();
        loadHolidays();
    </script>
</body>
</html>
