<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=2"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=1"></script>
    <link rel="stylesheet" href="/css/style.css?v=appearance-3">
    <script th:if="${isWeek}" src="/js/game-clock.js" defer></script>
    <script src="/js/calendar-pet.js?v=pet-catalog-2" defer></script>
    <script src="/js/pet-drag.js?v=pet-grab-3" defer></script>
</head>
<body>
    <main class="container" th:classappend="${isWeek} ? 'clock-page'">
        <time class="game-clock" th:if="${isWeek}">
            <span class="game-clock-date">日本時間</span>
            <span class="game-clock-time">--:--:--</span>
        </time>
        <h1 class="page-title" th:if="${isWeek}" th:text="|${firstDay.year}/${#numbers.formatInteger(firstDay.monthValue, 2)}/${#numbers.formatInteger(firstDay.dayOfMonth, 2)}〜${lastDay.year}/${#numbers.formatInteger(lastDay.monthValue, 2)}/${#numbers.formatInteger(lastDay.dayOfMonth, 2)}|">2026/10/25〜2026/10/31</h1>
        <h1 class="page-title" th:unless="${isWeek}" th:text="|${year}/${#numbers.formatInteger(month, 2)}|">2026/10</h1>
        <nav class="calendar-nav" aria-label="カレンダーの操作">
            <div class="calendar-nav-group">
                <a th:if="${isWeek}" th:href="@{/calendar(view='week',from=${previousWeek})}">前の週</a>
                <a th:if="${isWeek}" th:href="@{/calendar(view='week',from=${nextWeek})}">次の週</a>
                <a th:unless="${isWeek}" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
                <a th:unless="${isWeek}" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
                <a th:href="${isWeek} ? @{/calendar(view='week',from=${todayWeekStart})} : @{/calendar}">今日へ</a>
            </div>
            <div class="calendar-view-tabs" role="group" aria-label="表示切り替え">
                <a class="calendar-view-tab" th:classappend="${!isWeek} ? 'is-active'"
                   th:href="@{/calendar(year=${year},month=${month})}"
                   th:attr="aria-current=${!isWeek ? 'page' : null}">月間</a>
                <a class="calendar-view-tab" th:classappend="${isWeek} ? 'is-active'"
                   th:href="@{/calendar(view='week',from=${weekFrom})}"
                   th:attr="aria-current=${isWeek ? 'page' : null}">週間</a>
            </div>
            <div class="calendar-nav-group">
                <a th:if="${isWeek}" th:href="@{/reports/weekly(from=${firstDay})}">この週のレポート</a>
                <a href="/todos">表で見る</a>
                <a href="/todos/new">新規登録</a>
            </div>
        </nav>
        <div class="calendar-scroll">
            <table class="calendar-table" th:classappend="${isWeek} ? 'calendar-table-week'" th:attr="data-from=${firstDay},data-to=${lastDay},data-today=${today},data-view=${isWeek ? 'week' : 'month'}">
                <thead th:unless="${isWeek}">
                    <tr>
                        <th scope="col">日</th>
                        <th scope="col">月</th>
                        <th scope="col">火</th>
                        <th scope="col">水</th>
                        <th scope="col">木</th>
                        <th scope="col">金</th>
                        <th scope="col">土</th>
                    </tr>
                </thead>
                <tbody th:unless="${isWeek}">
                    <tr th:each="week : ${weeks}">
                        <th:block th:each="date : ${week}">
                            <td th:if="${date != null}" th:classappend="${date.equals(today)} ? 'calendar-today'" th:attr="data-date=${date}">
                                <div class="calendar-cell-content">
                                    <span th:text="${date.dayOfMonth}"></span><span class="calendar-today-badge" th:if="${date.equals(today)}">今日</span>
                                </div>
                            </td>
                            <td th:unless="${date != null}" class="calendar-empty"></td>
                        </th:block>
                    </tr>
                </tbody>
                <tbody th:if="${isWeek}">
                    <tr th:each="date, day : ${weeks[0]}" th:classappend="${date.equals(today)} ? 'calendar-today'" th:attr="data-date=${date}">
                        <th scope="row">
                            <time th:datetime="${date}" th:text="|${date.monthValue}月${date.dayOfMonth}日（${weekdayNames[day.index]}）|">日付</time>
                        </th>
                        <td>
                            <div class="calendar-cell-content"></div>
                            <span class="calendar-today-badge" th:if="${date.equals(today)}">今日</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <div class="calendar-pet-track" role="img" aria-label="メカ祥子が草地を歩き回る">
        <div class="calendar-pet" aria-hidden="true"></div>
    </div>
    <script>
        async function loadTodos() {
            const table = document.querySelector('.calendar-table');
            const from = table.dataset.from;
            const to = table.dataset.to;
            const isWeek = table.dataset.view === 'week';
            const cells = table.querySelectorAll('[data-date]');

            try {
                const res = await fetch(`/api/todos?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
                if (!res.ok) {
                    throw new Error('Todoの取得に失敗しました');
                }
                const todos = await res.json();
                const localToday = table.dataset.today;
                const returnTo = isWeek
                    ? `/calendar?view=week&from=${from}`
                    : `/calendar?year=${from.slice(0, 4)}&month=${Number(from.slice(5, 7))}`;

                function createTodoLink(todo) {
                    const item = document.createElement('a');
                    item.href = `/todos/${encodeURIComponent(todo.id)}/edit?returnTo=${encodeURIComponent(returnTo)}`;
                    item.classList.add('calendar-todo-link');
                    item.textContent = todo.title;
                    if (!todo.completed && todo.dueDate < localToday) {
                        item.classList.add('calendar-overdue');
                    }
                    return item;
                }

                for (const cell of cells) {
                    const content = cell.querySelector('.calendar-cell-content');
                    const dayTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                    if (isWeek && dayTodos.length === 0) {
                        content.textContent = '予定なし';
                        content.classList.add('calendar-week-empty');
                    }
                    for (const todo of (isWeek ? dayTodos : dayTodos.slice(0, 3))) {
                        const item = createTodoLink(todo);
                        if (!isWeek && dayTodos.length >= 3) {
                            item.classList.add('calendar-todo-compact');
                        }
                        content.appendChild(item);
                    }
                    if (!isWeek && dayTodos.length > 3) {
                        const details = document.createElement('details');
                        details.classList.add('calendar-more');
                        const summary = document.createElement('summary');
                        summary.textContent = `ほか ${dayTodos.length - 3}件`;
                        details.appendChild(summary);
                        const panel = document.createElement('div');
                        panel.classList.add('calendar-more-panel');
                        for (const todo of dayTodos.slice(3)) {
                            panel.appendChild(createTodoLink(todo));
                        }
                        details.appendChild(panel);
                        cell.appendChild(details);
                    }
                }
            } catch (error) {
                console.error(error);
            }
        }

        function showHolidayWarning() {
            if (document.getElementById('holiday-warning')) {
                return;
            }
            const warning = document.createElement('p');
            warning.id = 'holiday-warning';
            warning.textContent = '祝日を取れませんでした';
            document.querySelector('main').prepend(warning);
        }

        async function loadHolidays() {
            const table = document.querySelector('.calendar-table');
            const from = table.dataset.from;
            const to = table.dataset.to;
            const cells = table.querySelectorAll('[data-date]');

            for (const cell of cells) {
                const weekday = new Date(`${cell.dataset.date}T00:00:00Z`).getUTCDay();
                if (weekday === 6) {
                    cell.style.backgroundColor = '#e0f2fe';
                } else if (weekday === 0) {
                    cell.style.backgroundColor = '#ffe4e6';
                }
            }

            try {
                const res = await fetch(`/api/holidays?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
                if (res.headers.has('X-Holidays-Unavailable')) {
                    showHolidayWarning();
                }
                if (!res.ok) {
                    throw new Error('祝日の取得に失敗しました');
                }
                const holidays = await res.json();

                for (const cell of cells) {
                    const date = cell.dataset.date;
                    if (Object.prototype.hasOwnProperty.call(holidays, date)) {
                        cell.style.backgroundColor = '#fef3c7';
                        cell.title = holidays[date];
                    }
                }
            } catch (error) {
                showHolidayWarning();
                console.error(error);
            }
        }

        function fitWeekCalendar() {
            const table = document.querySelector('.calendar-table-week');
            if (!table) {
                return;
            }

            const contents = [...table.querySelectorAll('tbody .calendar-cell-content')];
            for (const content of contents) {
                content.style.removeProperty('max-height');
            }
            if (window.innerWidth < 720) {
                return;
            }

            const scrollArea = table.closest('.calendar-scroll');
            const tableTop = scrollArea.getBoundingClientRect().top + window.scrollY;
            const availableHeight = window.innerHeight - tableTop - 24;
            if (table.getBoundingClientRect().height <= availableHeight) {
                return;
            }

            function setContentLimit(height) {
                for (const content of contents) {
                    content.style.maxHeight = `${height}px`;
                }
            }

            let lowest = 32;
            let highest = Math.max(lowest, ...contents.map(content => content.scrollHeight));
            setContentLimit(lowest);
            if (table.getBoundingClientRect().height > availableHeight) {
                return;
            }

            while (lowest < highest) {
                const middle = Math.ceil((lowest + highest) / 2);
                setContentLimit(middle);
                if (table.getBoundingClientRect().height <= availableHeight) {
                    lowest = middle;
                } else {
                    highest = middle - 1;
                }
            }
            setContentLimit(lowest);
        }

        let fitFrame;
        function scheduleWeekCalendarFit() {
            window.cancelAnimationFrame(fitFrame);
            fitFrame = window.requestAnimationFrame(fitWeekCalendar);
        }

        loadTodos().then(scheduleWeekCalendarFit);
        loadHolidays().then(scheduleWeekCalendarFit);
        window.addEventListener('resize', scheduleWeekCalendarFit);
    </script>
</body>
</html>
