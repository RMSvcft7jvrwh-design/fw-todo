<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除確認</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=4"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=2"></script>
    <link rel="stylesheet" href="/css/style.css?v=appearance-6">
    <link rel="stylesheet" href="/css/todo-quest.css?v=3">
    <link rel="stylesheet" href="/css/shared-rpg-buttons.css?v=2">
</head>
<body>
    <main class="container quest-page">
      <div class="quest-board quest-board--confirm">
        <div class="quest-paper">
        <p class="confirm-value">やること：<span th:text="${todo.title}">やること</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category}">ジャンル</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>
        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
            <div class="confirm-actions">
                <button class="btn rpg-image-button rpg-image-button--delete" type="submit" aria-label="このTodoを削除する">削除する</button>
                <a class="btn sub rpg-image-button rpg-image-button--list" href="/todos" aria-label="削除せず一覧へ戻る">一覧へ</a>
            </div>
        </form>
        </div>
        <h1 class="quest-title">削除確認</h1>
        <img class="quest-clip" src="/assets/todos/themes/quest/clip.png" alt="" aria-hidden="true">
        <img class="quest-seal" src="/assets/todos/themes/quest/seal.png" alt="" aria-hidden="true">
      </div>
    </main>
</body>
</html>
