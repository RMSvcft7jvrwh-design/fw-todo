<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=4"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=2"></script>
    <link rel="stylesheet" th:href="@{/css/style.css(v='appearance-6')}" href="/css/style.css?v=appearance-6">
    <link rel="stylesheet" href="/css/shared-rpg-buttons.css?v=2">
    <link rel="stylesheet" th:href="@{/css/todos-board.css(v='production-3')}" href="/css/todos-board.css?v=production-3">
    <link rel="stylesheet" href="/css/todo-toasts.css?v=1">
    <script src="/js/todos-board.js" defer></script>
    <script src="/js/todo-toasts.js?v=1" defer></script>
    <script src="/js/pet-drag.js?v=pet-actions-2" defer></script>
</head>
<body>
    <p class="todo-toast" th:if="${message != null}"
       th:attr="data-toast-kind=${message == '保存しました' ? 'saved' : (message == '削除しました' ? 'deleted' : 'text')}"
       role="status" aria-live="polite"><span th:text="${message}"></span></p>
    <main class="todo-board-layout" aria-label="依頼掲示板">
        <div class="preview-controls" aria-label="Todoの検索と並び替え">
            <details class="board-navigation">
                <summary class="rpg-image-button--move">移動</summary>
                <nav aria-label="ほかの画面へ移動">
                    <a th:href="@{/calendar}" href="/calendar">カレンダーで見る</a>
                    <a th:href="@{/}" href="/">ホームに戻る</a>
                    <a th:href="@{/settings}" href="/settings">⚙ 設定</a>
                </nav>
            </details>
            <form class="preview-controls__search" th:action="@{/todos}" action="/todos" method="get">
                <label for="board-keyword">やることの名前</label>
                <input id="board-keyword" name="keyword" type="search" placeholder="名前で探す" th:value="${keyword}">
                <label for="board-category">ジャンル</label>
                <select id="board-category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
                <input type="hidden" name="order" th:value="${order}">
                <button class="rpg-image-button--filter" type="submit" aria-label="絞り込む">絞り込む</button>
            </form>
            <nav class="preview-controls__sort" aria-label="期限の並び替え">
                <span>期限の並び替え</span>
                <div class="preview-controls__sort-buttons">
                    <a th:href="@{/todos(keyword=${keyword},category=${category},order='asc')}" href="/todos?order=asc" th:classappend="${order == 'asc'} ? 'is-selected'" th:attr="aria-current=${order == 'asc'} ? 'true' : null">近い順</a>
                    <a th:href="@{/todos(keyword=${keyword},category=${category},order='desc')}" href="/todos?order=desc" th:classappend="${order == 'desc'} ? 'is-selected'" th:attr="aria-current=${order == 'desc'} ? 'true' : null">遠い順</a>
                </div>
            </nav>
            <a class="preview-controls__create" th:href="@{/todos/new}" href="/todos/new"><span class="visually-hidden">新規登録</span></a>
            <p class="preview-controls__count" th:text="|${#lists.size(todos)}件の依頼書|" role="status">0件の依頼書</p>
        </div>
        <section class="board" aria-labelledby="board-title">
            <div class="board__frame">
                <div class="board__paper" role="region" aria-label="依頼書一覧。縦にスクロールできます" tabindex="0">
                    <p class="board__empty" th:if="${#lists.isEmpty(todos)}" th:text="${keyword != '' or category != '' ? '条件に合うTodoはありません' : 'まだ1件も登録されていません'}">まだ1件も登録されていません</p>
                    <div class="notice-grid" th:unless="${#lists.isEmpty(todos)}" id="notice-grid">
                        <button class="notice-thumb" type="button" th:each="todo, stat : ${todos}" th:with="variant=${stat.index % 8}"
                                th:data-id="${todo.id}" th:data-title="${todo.title}" th:data-memo="${todo.detail == null ? '' : todo.detail}"
                                th:data-category="${todo.category}" th:data-priority="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"
                                th:data-due="${todo.dueDate == null ? '期限なし' : todo.dueDate}"
                                th:data-status="${todo.completed == true ? '完了' : '未完了'}"
                                th:data-completed-at="${todo.completedAt == null ? '' : #temporals.format(todo.completedAt, 'yyyy-MM-dd')}"
                                th:data-edit-url="@{/todos/{id}/edit(id=${todo.id})}"
                                th:data-delete-url="@{/todos/{id}/delete(id=${todo.id})}"
                                th:aria-label="${todo.title + '（' + (todo.completed == true ? '完了' : '未完了') + '）の依頼書を開く'}">
                            <img class="notice-thumb__image" th:if="${variant == 0}" src="/assets/todos/list/themes/japanese-board/notices/notice-01-gold.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 1}" src="/assets/todos/list/themes/japanese-board/notices/notice-02-red-pin.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 2}" src="/assets/todos/list/themes/japanese-board/notices/notice-03-sakura-tape.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 3}" src="/assets/todos/list/themes/japanese-board/notices/notice-04-wave.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 4}" src="/assets/todos/list/themes/japanese-board/notices/notice-05-wave-corner.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 5}" src="/assets/todos/list/themes/japanese-board/notices/notice-06-ribbon.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 6}" src="/assets/todos/list/themes/japanese-board/notices/notice-07-sakura-border.png" alt="">
                            <img class="notice-thumb__image" th:if="${variant == 7}" src="/assets/todos/list/themes/japanese-board/notices/notice-08-taped.png" alt="">
                            <img class="notice-thumb__pin" th:if="${variant % 4 == 0}" src="/assets/todos/list/themes/japanese-board/pins/pin-gold.png" alt="">
                            <img class="notice-thumb__pin" th:if="${variant % 4 == 1}" src="/assets/todos/list/themes/japanese-board/pins/pin-red.png" alt="">
                            <img class="notice-thumb__pin" th:if="${variant % 4 == 2}" src="/assets/todos/list/themes/japanese-board/pins/pin-blue.png" alt="">
                            <img class="notice-thumb__pin" th:if="${variant % 4 == 3}" src="/assets/todos/list/themes/japanese-board/pins/pin-wood.png" alt="">
                            <span class="notice-thumb__title" th:text="${todo.title}"></span>
                            <img class="notice-thumb__stamp notice-thumb__stamp--done" th:if="${todo.completed == true}" src="/assets/todos/list/themes/japanese-board/stamps/stamp-done.png" alt="">
                            <img class="notice-thumb__stamp" th:if="${todo.completed != true and todo.priority == 1}" src="/assets/todos/list/themes/japanese-board/stamps/stamp-important.png" alt="">
                        </button>
                    </div>
                </div>
            </div>
            <div class="board__roof" aria-hidden="true"></div>
            <div class="board__post board__post--left" aria-hidden="true"></div>
            <div class="board__post board__post--right" aria-hidden="true"></div>
            <img class="board__foot board__foot--left" src="/assets/todos/list/themes/japanese-board/exterior/foot.png" alt="" aria-hidden="true">
            <img class="board__foot board__foot--right" src="/assets/todos/list/themes/japanese-board/exterior/foot.png" alt="" aria-hidden="true">
            <img class="board__lantern" src="/assets/todos/list/themes/japanese-board/exterior/lantern.png" alt="" aria-hidden="true">
            <img class="board__sakura" src="/assets/todos/list/themes/japanese-board/decor/sakura-branch.png" alt="" aria-hidden="true">
            <h1 class="board__title" id="board-title"><img src="/assets/todos/list/themes/japanese-board/title-todo-list.png" alt="やること一覧"></h1>
        </section>
    </main>
    <dialog class="notice-dialog" id="notice-dialog" aria-labelledby="detail-title">
        <button class="notice-dialog__close rpg-image-button--close" id="notice-close" type="button" aria-label="閉じる">×</button>
        <div class="notice-dialog__body">
            <div class="notice-dialog__art">
                <img class="notice-dialog__image" id="detail-image" alt="選択した依頼書の絵柄">
                <img class="notice-dialog__pin" id="detail-pin" alt="">
                <span class="notice-dialog__paper-title" id="detail-paper-title"></span>
                <img class="notice-dialog__stamp" id="detail-stamp" alt="" hidden>
            </div>
            <div class="notice-dialog__details">
                <p class="notice-dialog__eyebrow">依頼書の詳細</p>
                <h2 id="detail-title"></h2>
                <p class="notice-dialog__memo" id="detail-memo"></p>
                <dl>
                    <div><dt>ジャンル</dt><dd id="detail-category"></dd></div>
                    <div><dt>優先度</dt><dd id="detail-priority"></dd></div>
                    <div><dt>期限</dt><dd id="detail-due"></dd></div>
                    <div><dt>状態</dt><dd id="detail-status"></dd></div>
                </dl>
            </div>
        </div>
        <div class="notice-dialog__actions">
            <a class="notice-dialog__action notice-dialog__action--edit" id="detail-edit" aria-label="このTodoを編集"></a>
            <a class="notice-dialog__action notice-dialog__action--delete" id="detail-delete" aria-label="このTodoの削除を確認"></a>
        </div>
    </dialog>
    <main class="container todo-page plain-todos">
        <h1 class="page-title">やること一覧</h1>
        <div class="todo-panel todo-panel--japanese">
            <div class="todo-panel__content" role="region" aria-label="やること一覧" tabindex="0">
                <form class="search-bar" th:action="@{/todos}" method="get">
                    <label for="keyword">やることの名前</label>
                    <input class="form-input" type="text" id="keyword" name="keyword" th:value="${keyword}">
                    <label for="category">ジャンル</label>
                    <select class="form-input" id="category" name="category">
                        <option value="" th:selected="${category == ''}">すべて</option>
                        <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                        <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                        <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                        <option value="資格" th:selected="${category == '資格'}">資格</option>
                        <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                    </select>
                    <input type="hidden" name="order" th:value="${order}">
                    <button class="btn" type="submit">絞り込む</button>
                </form>
                <nav class="sort-links" aria-label="期限の並び替え">
                    <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc')}">期限が近い順</a>
                    <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc')}">期限が遠い順</a>
                </nav>
                <nav class="todo-actions" aria-label="やること画面の移動">
                    <a class="btn" href="/todos/new">新規登録</a>
                    <a class="btn sub" href="/calendar">カレンダーで見る</a>
                    <a class="btn sub" th:href="@{/}" href="/">ホームに戻る</a>
                    <a class="btn sub" th:href="@{/settings}" href="/settings">⚙ 設定</a>
                </nav>
                <p class="todo-panel__empty" th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>
                <div class="todo-panel__table-scroll" th:unless="${#lists.isEmpty(todos)}" role="region" aria-label="やること一覧表" tabindex="0">
                    <table class="todo-table">
                        <thead>
                            <tr>
                                <th scope="col">やること</th>
                                <th scope="col">ジャンル</th>
                                <th scope="col">優先度</th>
                                <th scope="col">期限</th>
                                <th scope="col">状態</th>
                                <th scope="col">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="todo : ${todos}" th:classappend="${todo.completed != true and todo.dueDate != null and todo.dueDate.isBefore(today)} ? 'todo-overdue'">
                                <td th:text="${todo.title}"></td>
                                <td th:text="${todo.category}"></td>
                                <td><span class="priority-high-marker" th:if="${todo.priority == 1}" aria-hidden="true">★</span><span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></span></td>
                                <td th:text="${todo.dueDate}"></td>
                                <td>
                                    <span th:text="${todo.completed ? '完了' : '未完了'}"></span>
                                    <span th:if="${todo.completedAt != null}" th:text="|（${#temporals.format(todo.completedAt, 'yyyy-MM-dd')}）|"></span>
                                </td>
                                <td><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <div class="idle-pet" th:classappend="${message == '登録しました'} ? 'is-jumping'" role="img" aria-label="メカ祥子が待機している"></div>
</body>
</html>
