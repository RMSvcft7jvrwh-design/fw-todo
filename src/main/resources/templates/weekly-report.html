<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週間レポート</title>
    <script src="/js/background-theme.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/game-clock.js" defer></script>
</head>
<body>
    <main class="container clock-page">
        <time class="game-clock">
            <span class="game-clock-date">日本時間</span>
            <span class="game-clock-time">--:--:--</span>
        </time>
        <div class="report-intro">
            <div class="report-intro-content">
                <h1 class="page-title">週間レポート</h1>
                <p class="report-period" th:text="|${#temporals.format(weekStart, 'yyyy年M月d日')}～${#temporals.format(weekEnd, 'yyyy年M月d日')}（日～土）|">対象期間</p>
                <nav class="report-nav" aria-label="レポートの週移動">
                    <a class="link" th:href="@{/reports/weekly(from=${previousWeek})}">前の週</a>
                    <a class="link" th:href="@{/reports/weekly(from=${nextWeek})}">次の週</a>
                    <a class="link" th:href="@{/reports/weekly}">今週へ</a>
                    <a class="link" th:href="@{/calendar(view='week',from=${weekStart})}">週間カレンダーへ</a>
                </nav>
            </div>
            <div class="report-pet-track" role="img" aria-label="メカ祥子が時々左右に歩く">
                <div class="report-pet" aria-hidden="true"></div>
            </div>
        </div>

        <section class="report-section" aria-labelledby="due-heading">
            <h2 id="due-heading">この週が期限のTodo</h2>
            <div class="report-stats">
                <p>総件数 <strong th:text="${dueTotal}">0</strong>件</p>
                <p>完了 <strong th:text="${dueCompleted}">0</strong>件</p>
                <p>未完了 <strong th:text="${dueIncomplete}">0</strong>件</p>
                <p>完了率 <strong th:text="|${completionRate}%|">0%</strong></p>
            </div>
            <progress class="report-progress" th:value="${completionRate}" th:text="|${completionRate}%|" max="100" aria-label="この週が期限のTodoの完了率">0%</progress>
            <h3>ジャンル別件数</h3>
            <p th:if="${dueCategoryCounts.isEmpty()}">該当するTodoはありません。</p>
            <ul class="report-categories" th:unless="${dueCategoryCounts.isEmpty()}">
                <li th:each="entry : ${dueCategoryCounts}"><span th:text="${entry.key}">ジャンル</span><strong th:text="|${entry.value}件|">0件</strong></li>
            </ul>
        </section>

        <section class="report-section" aria-labelledby="completed-heading">
            <h2 id="completed-heading">この週に完了したTodo</h2>
            <p class="report-note">完了日時で集計します。期限がこの週以外のTodoも含みます。</p>
            <div class="report-stats">
                <p>完了件数 <strong th:text="${completedTotal}">0</strong>件</p>
            </div>
            <h3>ジャンル別完了件数</h3>
            <p th:if="${completedCategoryCounts.isEmpty()}">該当するTodoはありません。</p>
            <ul class="report-categories" th:unless="${completedCategoryCounts.isEmpty()}">
                <li th:each="entry : ${completedCategoryCounts}"><span th:text="${entry.key}">ジャンル</span><strong th:text="|${entry.value}件|">0件</strong></li>
            </ul>
        </section>
    </main>
    <script>
        (() => {
            const track = document.querySelector('.report-pet-track');
            const pet = track.querySelector('.report-pet');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const spriteWidth = 124;
            const spriteHeight = 178;
            const walkFrames = {
                right: [
                    [27, 190, 117, 178], [199, 190, 116, 178], [370, 190, 118, 178], [540, 190, 122, 178],
                    [713, 190, 120, 178], [884, 190, 121, 178], [1057, 190, 119, 178], [1230, 190, 116, 178]
                ],
                left: [
                    [28, 377, 116, 177], [200, 377, 116, 177], [371, 377, 118, 177], [541, 377, 122, 177],
                    [714, 377, 120, 177], [886, 377, 120, 177], [1058, 377, 119, 177], [1231, 377, 116, 177]
                ]
            };
            let position = 0;
            let direction = -1;
            let walking = false;
            let frameIndex = 0;
            let frameTime = 0;
            let legTime = 0;
            let pausedMidway = false;
            let lastTime = 0;
            let animationId;
            let pauseId;
            let dragPointerId = null;
            let grabOffset = 0;
            let lastPointerX = 0;
            let dragDirection = 0;
            let initialized = false;

            function travelLimit() {
                return Math.max(0, track.clientWidth - spriteWidth);
            }

            function placePet() {
                position = Math.max(0, Math.min(position, travelLimit()));
                pet.style.transform = `translateX(${position}px)`;
            }

            function showWalkFrame() {
                const [x, y, width, height] = walkFrames[direction > 0 ? 'right' : 'left'][frameIndex];
                const left = Math.floor((spriteWidth - width) / 2);
                const top = spriteHeight - height;
                pet.style.backgroundPosition = `${left - x}px ${top - y}px`;
            }

            function pauseWalk(duration) {
                walking = false;
                pet.classList.remove('is-walking');
                pet.style.removeProperty('background-position');
                lastTime = 0;
                animationId = undefined;
                if (!reducedMotion.matches && dragPointerId === null) {
                    pauseId = window.setTimeout(startWalk, duration);
                }
            }

            function stopAutonomy() {
                if (pauseId !== undefined) window.clearTimeout(pauseId);
                if (animationId !== undefined) cancelAnimationFrame(animationId);
                pauseId = undefined;
                animationId = undefined;
                walking = false;
                pet.classList.remove('is-walking');
                pet.style.removeProperty('background-position');
                lastTime = 0;
            }

            function step(now) {
                if (!walking || reducedMotion.matches) return;
                if (lastTime === 0) {
                    lastTime = now;
                    animationId = requestAnimationFrame(step);
                    return;
                }

                const elapsed = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;
                position += direction * 50 * elapsed;
                placePet();
                frameTime += elapsed * 1000;
                legTime += elapsed;
                if (frameTime >= 120) {
                    frameIndex = (frameIndex + 1) % 8;
                    frameTime %= 120;
                    showWalkFrame();
                }

                if ((direction > 0 && position >= travelLimit()) || (direction < 0 && position <= 0)) {
                    direction *= -1;
                    legTime = 0;
                    pausedMidway = false;
                    pauseWalk(1800);
                    return;
                }
                if (!pausedMidway && legTime >= 2.2) {
                    pausedMidway = true;
                    pauseWalk(1400);
                    return;
                }
                animationId = requestAnimationFrame(step);
            }

            function startWalk() {
                pauseId = undefined;
                if (reducedMotion.matches || dragPointerId !== null || travelLimit() === 0) return;
                walking = true;
                pet.classList.add('is-walking');
                frameIndex = 0;
                frameTime = 0;
                lastTime = 0;
                showWalkFrame();
                animationId = requestAnimationFrame(step);
            }

            function resetMotion() {
                stopAutonomy();
                if (!initialized) {
                    position = travelLimit();
                    initialized = true;
                }
                if (position <= 0) direction = 1;
                if (position >= travelLimit()) direction = -1;
                legTime = 0;
                pausedMidway = false;
                placePet();
                if (!reducedMotion.matches && dragPointerId === null) {
                    pauseId = window.setTimeout(startWalk, 3500);
                }
            }

            function finishDrag(event) {
                if (event.pointerId !== dragPointerId) return;
                dragPointerId = null;
                pet.classList.remove('is-dragging');
                if (pet.hasPointerCapture(event.pointerId)) {
                    pet.releasePointerCapture(event.pointerId);
                }
                if (position <= 0) direction = 1;
                else if (position >= travelLimit()) direction = -1;
                else if (dragDirection !== 0) direction = dragDirection;
                legTime = 0;
                pausedMidway = false;
                if (!reducedMotion.matches) {
                    pauseId = window.setTimeout(startWalk, 2200);
                }
            }

            pet.addEventListener('pointerdown', event => {
                if (!event.isPrimary || event.button !== 0 || dragPointerId !== null) return;
                event.preventDefault();
                stopAutonomy();
                dragPointerId = event.pointerId;
                lastPointerX = event.clientX;
                grabOffset = event.clientX - track.getBoundingClientRect().left - position;
                dragDirection = 0;
                pet.classList.add('is-dragging');
                pet.setPointerCapture(event.pointerId);
            });

            pet.addEventListener('pointermove', event => {
                if (event.pointerId !== dragPointerId) return;
                lastPointerX = event.clientX;
                const previous = position;
                position = event.clientX - track.getBoundingClientRect().left - grabOffset;
                placePet();
                if (position !== previous) dragDirection = Math.sign(position - previous);
            });

            pet.addEventListener('pointerup', finishDrag);
            pet.addEventListener('pointercancel', finishDrag);
            pet.addEventListener('lostpointercapture', finishDrag);
            window.addEventListener('blur', () => {
                if (dragPointerId !== null) finishDrag({ pointerId: dragPointerId });
            });

            window.addEventListener('resize', () => {
                placePet();
                if (dragPointerId !== null) {
                    grabOffset = lastPointerX - track.getBoundingClientRect().left - position;
                }
            });
            reducedMotion.addEventListener('change', resetMotion);
            resetMotion();
        })();
    </script>
</body>
</html>
