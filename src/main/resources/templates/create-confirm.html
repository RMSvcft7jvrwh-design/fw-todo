<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録の確認</title>
    <script src="/js/background-theme.js"></script>
    <script src="/js/customization/catalog.js?v=2"></script>
    <script src="/js/customization/storage.js?v=1"></script>
    <script src="/js/customization/apply.js?v=1"></script>
    <link rel="stylesheet" href="/css/style.css?v=appearance-3">
    <script src="/js/pet-drag.js?v=pet-grab-3" defer></script>
</head>
<body>
    <main class="container">
        <h1 class="page-title">登録の確認</h1>
        <p class="confirm-value">やること：<span th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}">（入力なし）</span></p>
        <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}">（入力なし）</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : (todo.priority == 3 ? '低' : '（入力なし）'))}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">（入力なし）</span></p>
        <form th:action="@{/todos}" method="post" th:object="${todo}">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">
            <div class="confirm-actions">
                <button class="btn" type="submit">登録する</button>
                <button class="btn sub" type="submit" formaction="/todos/new">書き直す</button>
            </div>
        </form>
    </main>
    <div class="idle-pet" role="img" aria-label="メカ祥子が待機している"></div>
</body>
</html>
